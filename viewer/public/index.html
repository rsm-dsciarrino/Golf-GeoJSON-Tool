<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mapbox-token" content="__MAPBOX_TOKEN__">
  <title>Golf GeoJSON Viewer</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Courier New', Courier, monospace; background: #000; }
    #map { position: fixed; inset: 0; }

    .panel {
      position: absolute;
      background: rgba(8, 8, 8, 0.9);
      border: 1px solid #252525;
      color: #bbb;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      z-index: 10;
    }

    #legend {
      top: 10px;
      right: 10px;
      min-width: 190px;
      max-width: 260px;
      max-height: 60vh;
      overflow-y: auto;
    }

    #legend-header {
      padding: 7px 12px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      border-bottom: 1px solid #1c1c1c;
    }

    #legend-list { padding: 4px 0; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .legend-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #999;
    }

    .legend-empty {
      padding: 8px 12px;
      color: #3a3a3a;
    }

    #clear-btn {
      bottom: 36px;
      right: 10px;
      padding: 7px 14px;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      color: #888;
      background: rgba(8, 8, 8, 0.9);
      border: 1px solid #252525;
      font-family: 'Courier New', Courier, monospace;
      transition: color 0.15s, border-color 0.15s;
    }

    #clear-btn:hover {
      color: #ff4444;
      border-color: #552222;
    }

    #status {
      bottom: 10px;
      left: 10px;
      padding: 5px 10px;
      font-size: 10px;
      color: #444;
      letter-spacing: 0.06em;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="legend">
    <div id="legend-header">Features</div>
    <div id="legend-list">
      <div class="legend-empty">no features loaded</div>
    </div>
  </div>

  <button class="panel" id="clear-btn">Clear Map</button>
  <div class="panel" id="status">LIVE</div>

  <script>
    const token = document.querySelector('meta[name="mapbox-token"]').content;
    mapboxgl.accessToken = token;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-streets-v12',
      center: [0, 20],
      zoom: 2,
    });

    function updateLegend(geojson) {
      const list = document.getElementById('legend-list');
      const features = geojson.features || [];
      if (!features.length) {
        list.innerHTML = '<div class="legend-empty">no features loaded</div>';
        return;
      }
      list.innerHTML = features.map(f => {
        const name = f.properties?.name || 'unnamed';
        const color = f.properties?.['feature-color'] || '#00ff88';
        return `<div class="legend-item">
          <span class="legend-dot" style="background:${color}"></span>
          <span class="legend-name" title="${name}">${name}</span>
        </div>`;
      }).join('');
    }

    function fitToBounds(geojson) {
      const features = geojson.features || [];
      if (!features.length) return;
      const bounds = new mapboxgl.LngLatBounds();
      function extendCoords(coords) {
        if (typeof coords[0] === 'number') {
          bounds.extend(coords);
        } else {
          coords.forEach(extendCoords);
        }
      }
      features.forEach(f => {
        if (f.geometry?.coordinates) extendCoords(f.geometry.coordinates);
      });
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, { padding: 60, maxZoom: 18, duration: 800 });
      }
    }

    map.on('load', async () => {
      const res = await fetch('/geojson');
      const geojson = await res.json();

      map.addSource('golf-features', { type: 'geojson', data: geojson });

      map.addLayer({
        id: 'golf-fill',
        type: 'fill',
        source: 'golf-features',
        filter: ['==', '$type', 'Polygon'],
        paint: {
          'fill-color': ['coalesce', ['get', 'feature-color'], '#00ff88'],
          'fill-opacity': 0.38,
        },
      });

      map.addLayer({
        id: 'golf-outline',
        type: 'line',
        source: 'golf-features',
        filter: ['==', '$type', 'Polygon'],
        paint: {
          'line-color': ['coalesce', ['get', 'feature-color'], '#00ff88'],
          'line-width': 2,
        },
      });

      map.addLayer({
        id: 'golf-circle',
        type: 'circle',
        source: 'golf-features',
        filter: ['==', '$type', 'Point'],
        paint: {
          'circle-radius': 8,
          'circle-color': ['coalesce', ['get', 'feature-color'], '#00ff88'],
          'circle-stroke-width': 1,
          'circle-stroke-color': '#000',
        },
      });

      updateLegend(geojson);
      fitToBounds(geojson);
    });

    const evtSource = new EventSource('/events');
    const statusEl = document.getElementById('status');

    evtSource.addEventListener('geojson-updated', async () => {
      const res = await fetch('/geojson');
      const geojson = await res.json();
      map.getSource('golf-features').setData(geojson);
      updateLegend(geojson);
      fitToBounds(geojson);
    });

    evtSource.onopen = () => { statusEl.textContent = 'LIVE'; statusEl.style.color = '#3a3a3a'; };
    evtSource.onerror = () => { statusEl.textContent = 'RECONNECTING...'; statusEl.style.color = '#664422'; };

    document.getElementById('clear-btn').addEventListener('click', async () => {
      await fetch('/geojson', { method: 'DELETE' });
    });
  </script>
</body>
</html>
